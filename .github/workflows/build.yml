name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test notification behavior
        run: python tests/run_tests.py
      - name: Read upstream pin
        id: upstream
        run: |
          python - <<'PY'
          import json, os
          c = json.load(open('upstream.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('commit=' + c['commit'] + '\n')
              f.write('version=' + c['project_version'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: ${{ steps.upstream.outputs.commit }}
          path: work/upstream
          persist-credentials: false
      - name: Prepare pinned sources
        run: python scripts/prepare.py work/upstream
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android patch bundle
        working-directory: work/upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace
      - name: Verify and package bundle
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          if [[ "$REF" == refs/tags/* && "$REF" != "refs/tags/v$VERSION" ]]; then
            echo 'Release tag differs from upstream.json project_version'; exit 1
          fi
          python scripts/package_release.py work/upstream --repository "$REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: flyme-lyrics-patches
          path: dist/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: flyme-lyrics-patches
          path: dist
      - name: Publish release and source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Independent community bundle based on Morphe v2.1.0, adding Flyme status bar lyrics.

          Select **Flyme status bar lyrics** and its official **Third-party lyrics** dependency, then enable third-party, lock-screen and Flyme lyrics in YT Music.

          Validation: notification behavior tests, full Android bundle compilation and bundle content checks. Real Flyme device and APK patch/install verification are still required. This release contains no YouTube Music APK.
          EOF
          gh release create "$TAG" dist/* --title "Flyme Lyrics Patches $TAG" --notes-file release-notes.md --verify-tag
          cp dist/patches-bundle.json patches-bundle.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json
          git commit -m "chore: publish source for $TAG [skip ci]"
          git push origin main
